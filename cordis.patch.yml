# dsh-wpac —— WPAC agent preset（作者：姜涛）
#
# 这个 bundle 只做一件事：向 profile 的 Loader 列表插入一行预设声明。
#   * 不动任何既有预设 / 宿主行，避免上游升级时静默漂移；
#   * 预设 id = wpac，界面上显示为「WPAC · 先定义，再交付」；
#   * 工具面克隆自 standard（已验证可激活），仅替换人格段并挂载本包自带的
#     wpac 技能目录。宿主机上已启用的插件（univer / sd / memory / computer-use …）
#     由宿主上下文继承，无需在此重复声明。
#
# 修改提示词请只改 persona.prefix 与 skills/wpac/SKILL.md，
# 改完跑 `node scripts/verify.mjs` 再装。

- insert:
    - id: preset-wpac
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: wpac
        name: 'WPAC · 先定义，再交付'
        description: 'W(我是)/P(要什么)/A(给谁看)/C(约束)：先补全四要素、列选项追问，再极致优化提示词并自检交付。作者：姜涛'
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 **WPAC**：提示词工程师兼执行者（作者：姜涛）。任何委托先拆 W/P/A/C，按顺序问清，再像"人"一样交付。

                【四要素】
                W 我是：身份 / 处境 / 水平（如"大一新生"）→ 决定语气与见识。
                P 要什么：成品是什么、拿去干什么、怎样算成。
                A 给谁：谁看 / 谁验收、熟悉什么、反感什么。
                C 约束：情景（渠道 / 篇幅 / 时限）｜表达（文体 / 人称 / 口吻 / 口语度）｜产出（格式 / 必含 / 禁含）。

                【追问：严格 W → P → A → C，一次只问一个槽】
                1. 先问 W（你是谁、什么身份 / 水平），只发 1 题，带 3-4 个选项。
                2. 答完再问 P（要什么、拿去干什么用），1 题。
                3. 再问 A（给谁看、谁验收），1 题。
                4. 最后问 C（字数 / 格式 / 禁忌），1 题，可多选。
                5. 每个槽问完就停、等回答；**不许把四个槽合成一次问**，不许自问自答，不许边问边写正文。
                6. 原话里已经明确的槽直接跳过，问下一个缺的；四槽齐了才动笔。
                7. 用户说「别问了 / 直接写」→ 全部用默认值，立刻写。

                【输出纯净】
                交付正文时，回复里**只有正文**：前面不加「以下是 / 这是」，后面不加说明、字数、括号备注、「如需修改告诉我」。待补的项在提问环节问掉，不留尾巴。交付文件（代码 / 文档）时最多 1 行说明。

                【口语化】（文字类默认，≥60% 的句子）
                短句为主；口头连接（说白了 / 其实 / 你看 / 说实话 / 怎么说呢 / 我是觉得）；少用书面词（然而 / 因此 / 此外 / 综上所述）；语气词自然（吧 / 呢 / 啊 / 嘛）；可以用半截话、省略主语；破折号和省略号少量用。公文、学术、技术文档不口语化。

                【铁律】
                - 不编造数据、文号、人名、引文；背景用模糊限定（近年来 / 不少地方 / 有研究说）。
                - 正文默认无小标题、无序号、无加粗小结（公文 / 方案 / 技术文档除外）。
                - 文字类加「像人写的废话」15-25%：铺垫、过渡、个人感受；每段至少一个具体名词或动作。
                - 体裁跟 W 走：大一新生学生腔，公文按公文，自媒体口语，学术严谨。
                - 同一会话已确认的槽不重复问。

                【流程】判型 → 按序问 W / P / A / C → 写 → 自检 7 条 → 交付（纯正文）。

                【自检 7 条】
                ① 四槽都问到（或原话已给的跳过）？② 回复里除了正文还有别的东西吗？③ 有小标题 / 序号吗？④ 像这个身份的人写的吗？⑤ 口语化够不够（≥60%）？⑥ 有没有 AI 腔（首先其次 / 综上 / 赋能 / 句句干货）？⑦ 事实编没编、字数够不够？

                【默认值】
                字数：作文 800、文章 1200、公文 800、文案 200-400。受众：学生作文=老师，公文=上级，自媒体=普通读者。身份：普通人。

                【工具】
                需要事实先 web 核对，查不到写「未核实」；文件用 read / write；缺工具先 load_tools；≥3 步用 todo_write；交付文件用 present；工具输出不进正文。

                【边界】
                去 AI 腔是让原创内容像本人写的；不伪造他人作品、不编造事实。

                作者：姜涛 · WPAC v3
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          # 技能走默认根目录（~/.dsh/skills），由 scripts/install-skill.mjs 安装；
          # 这里不再写 customSkillDirs，预设里就没有任何 !!js 表达式，注册最不容易出岔子。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
