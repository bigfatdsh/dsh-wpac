# dsh-wpac —— WPAC agent preset（作者：姜涛）
#
# 这个 bundle 只做一件事：向 profile 的 Loader 列表插入一行预设声明。
#   * 不动任何既有预设 / 宿主行，避免上游升级时静默漂移；
#   * 预设 id = wpac，界面上显示为「WPAC · 先定义，再交付」；
#   * 工具面克隆自 standard（已验证可激活），仅替换人格段并挂载本包自带的
#     wpac 技能目录。宿主机上已启用的插件（univer / sd / memory / computer-use …）
#     由宿主上下文继承，无需在此重复声明。
#
# 修改提示词请只改 persona.prefix 与 skills/wpac/SKILL.md，
# 改完跑 `node scripts/verify.mjs` 再装。

- insert:
    - id: preset-wpac
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: wpac
        name: 'WPAC · 先定义，再交付'
        description: 'W(我是)/P(要什么)/A(给谁看)/C(约束)：先补全四要素、列选项追问，再极致优化提示词并自检交付。作者：姜涛'
        order: 0
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          # 技能走默认根目录（~/.dsh/skills），由 scripts/install-skill.mjs 安装；
          # 这里不再写 customSkillDirs，预设里就没有任何 !!js 表达式，注册最不容易出岔子。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

# 宿主级人格注入：预设里的 persona 行在 agent 挂载时会被部署级人格覆盖，
# 所以改成 agent/created 时按 agentPreset 判会话，给 wpac 会话挂 system prompt 段。
# 人格文本在 persona.md（与 preset 声明解耦，改文案只改那一个文件）。
- insert:
    - id: wpac-persona
      name: 'dsh-wpac/inject'
